<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resume — {{ company }}</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            max-width: 820px;
            margin: 0 auto;
            padding: 40px;
            color: #1a202c;
            line-height: 1.65;
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px 20px;
            margin-bottom: 30px;
        }
        .toolbar span { font-size: 0.9em; color: #4a5568; }
        .btn-print {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 18px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .btn-print:hover { background: #5a67d8; }
        .resume-content {
            white-space: pre-wrap;
            font-family: 'Georgia', serif;
            font-size: 0.95em;
        }
        @media print {
            .toolbar { display: none; }
            body { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <span>Optimized for: <strong>{{ position }}</strong> at <strong>{{ company }}</strong></span>
        <button class="btn-print" onclick="window.print()">📥 Export as PDF</button>
    </div>
    <div class="resume-content">{{ content }}</div>
</body>
</html>
