<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resume — {{ company }}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            color: #1a202c;
        }

        /* ── Toolbar ── */
        .toolbar {
            position: sticky; top: 0; z-index: 10;
            display: flex; justify-content: space-between; align-items: center;
            background: #1e293b; color: white;
            padding: 12px 32px;
            font-size: 0.88em;
        }
        .toolbar-info { opacity: 0.75; }
        .toolbar-info strong { color: #a5b4fc; opacity: 1; }
        .btn-print {
            background: #6366f1; color: white; border: none;
            border-radius: 6px; padding: 8px 20px; cursor: pointer;
            font-size: 0.88em; font-weight: 600; letter-spacing: 0.3px;
            transition: background 0.2s;
        }
        .btn-print:hover { background: #4f46e5; }

        /* ── Page ── */
        .page {
            max-width: 780px; margin: 32px auto 60px;
            background: white;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            border-radius: 4px;
        }

        /* ── Resume content styles ── */
        .resume-body { padding: 48px 52px; }

        /* Name / header */
        .resume-body h1 {
            font-family: 'Lora', serif;
            font-size: 2em; font-weight: 600;
            color: #0f172a; letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        /* Contact line (usually a <p> right after h1) */
        .resume-body h1 + p {
            font-size: 0.82em; color: #64748b;
            margin-bottom: 24px; line-height: 1.6;
        }

        /* Section headings */
        .resume-body h2 {
            font-size: 0.72em; font-weight: 700;
            text-transform: uppercase; letter-spacing: 2px;
            color: #6366f1; margin: 28px 0 10px;
            padding-bottom: 6px;
            border-bottom: 1.5px solid #e2e8f0;
        }

        /* Company / role headings */
        .resume-body h3 {
            font-size: 0.95em; font-weight: 600;
            color: #0f172a; margin: 14px 0 2px;
        }

        /* Body text */
        .resume-body p {
            font-size: 0.88em; line-height: 1.75;
            color: #374151; margin-bottom: 6px;
        }

        /* Bullet lists */
        .resume-body ul {
            padding-left: 18px; margin: 4px 0 10px;
        }
        .resume-body ul li {
            font-size: 0.87em; line-height: 1.7;
            color: #374151; margin-bottom: 3px;
        }
        .resume-body ol {
            padding-left: 18px; margin: 4px 0 10px;
        }
        .resume-body ol li {
            font-size: 0.87em; line-height: 1.7;
            color: #374151; margin-bottom: 3px;
        }

        /* Inline formatting */
        .resume-body strong { color: #0f172a; font-weight: 600; }
        .resume-body em { color: #475569; }
        .resume-body a { color: #6366f1; text-decoration: none; }
        .resume-body a:hover { text-decoration: underline; }

        /* Optimized badge */
        .optimized-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: #ede9fe; color: #6d28d9;
            padding: 4px 10px; border-radius: 20px;
            font-size: 0.72em; font-weight: 600; margin-bottom: 20px;
        }

        @media print {
            body { background: white; }
            .toolbar { display: none; }
            .page { box-shadow: none; margin: 0; border-radius: 0; max-width: 100%; }
            .resume-body { padding: 20px 28px; }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <span class="toolbar-info">Optimized for <strong>{{ position }}</strong> at <strong>{{ company }}</strong></span>
        <button class="btn-print" onclick="window.print()">📥 Export as PDF</button>
    </div>

    <div class="page">
        <div class="resume-body">
            {% if company %}
            <div class="optimized-badge">✨ Tailored for {{ company }}</div>
            {% endif %}
            {{ content|safe }}
        </div>
    </div>
</body>
</html>
