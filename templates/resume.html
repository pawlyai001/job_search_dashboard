<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resume — {{ company }}</title>
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Georgia', serif;
            color: #1a202c;
            background: #f7fafc;
        }
        .toolbar {
            position: sticky; top: 0; z-index: 10;
            display: flex; justify-content: space-between; align-items: center;
            background: white; border-bottom: 1px solid #e2e8f0;
            padding: 12px 32px;
        }
        .toolbar span { font-size: 0.9em; color: #4a5568; }
        .btn-print {
            background: #667eea; color: white; border: none;
            border-radius: 6px; padding: 8px 20px; cursor: pointer; font-size: 0.9em;
        }
        .btn-print:hover { background: #5a67d8; }
        .resume-wrapper {
            max-width: 820px; margin: 32px auto; padding: 48px;
            background: white; box-shadow: 0 2px 16px rgba(0,0,0,0.08);
            border-radius: 8px; min-height: 80vh;
        }
        /* Quill content styles */
        .resume-body h1 { font-size: 1.8em; color: #2d3748; margin-bottom: 4px; }
        .resume-body h2 {
            font-size: 1.05em; color: #667eea; text-transform: uppercase;
            letter-spacing: 1.5px; margin: 20px 0 8px;
            border-bottom: 1px solid #e2e8f0; padding-bottom: 4px;
        }
        .resume-body h3 { font-size: 1em; color: #2d3748; margin: 12px 0 4px; }
        .resume-body p { font-size: 0.93em; line-height: 1.7; margin-bottom: 6px; color: #4a5568; }
        .resume-body ul, .resume-body ol {
            padding-left: 20px; margin-bottom: 8px;
        }
        .resume-body li { font-size: 0.92em; line-height: 1.65; color: #4a5568; margin-bottom: 2px; }
        .resume-body strong { color: #2d3748; }
        .resume-body a { color: #667eea; }

        @media print {
            .toolbar { display: none; }
            body { background: white; }
            .resume-wrapper { box-shadow: none; margin: 0; padding: 20px; border-radius: 0; }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <span>Optimized for <strong>{{ position }}</strong> at <strong>{{ company }}</strong></span>
        <button class="btn-print" onclick="window.print()">📥 Export as PDF</button>
    </div>
    <div class="resume-wrapper">
        <div class="resume-body">{{ content|safe }}</div>
    </div>
</body>
</html>
